<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>TaskBoard</h1>

    <form id="add-form">
      <label for="new-title" class="visually-hidden">New task</label>
      <input id="new-title" type="text" placeholder="What needs to be done?" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <p id="form-error" class="error" role="alert" hidden></p>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
    </div>

    <ul id="task-list"></ul>
    <p id="empty-note" hidden>No tasks to show.</p>

    <footer><p id="items-left"></p></footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
